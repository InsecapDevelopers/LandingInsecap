# nginx del contenedor (sirve dist/ prerenderizado). Tarea #8, decisión 1.2.
#
# Detrás del nginx del VPS (TLS, HSTS, http→https; ver docs/nginx-vps.conf).
# Estructura de dist/: un HTML por ruta en dist/<locale>/<ruta>/index.html,
# más dist/404.html (404 real) y dist/_shell.html (render en el cliente, noindex).
# En la raíz, robots.txt, sitemap-index.xml, sitemap-es.xml, sitemap-intl.xml, llms.txt y
# llms-full.txt (Fase 5).
# dist/redirects.map (lo genera scripts/prerender.mjs) va a /etc/nginx/redirects.map (Dockerfile).
#
# Validar la sintaxis sin instalar nginx (después de npm run build):
#   docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     -v "$PWD/snippets:/etc/nginx/snippets:ro" \
#     -v "$PWD/dist/redirects.map:/etc/nginx/redirects.map:ro" nginx:1.27-alpine nginx -t

# 301 de las URLs antiguas (Fase 2, src/lib/legacy-redirects.ts): destino final con prefijo de
# idioma en un solo salto. Las exactas (ea-* → categoría, curso-empresa/curso-X → cursos/X) se
# buscan primero; después las regex en orden. Vacío: no es una URL antigua.
# ~3.300 claves exactas (ea-* × curso/cursos × idiomas × barra final): sin esto nginx avisa
# "could not build optimal map_hash".
map_hash_max_size 8192;
map_hash_bucket_size 256;
map $uri $legacy_redirect {
    default "";
    include /etc/nginx/redirects.map;
}

# www → apex. Funciona si el VPS reenvía Host (proxy_set_header Host $host);
# el VPS tiene el mismo 301 por si no lo hace.
server {
    listen 80;
    server_name www.insecap.cl;

    server_tokens off;
    # URL antigua en www: directo al destino final (un salto, no dos).
    if ($legacy_redirect) {
        return 301 https://insecap.cl$legacy_redirect$is_args$args;
    }
    return 301 https://insecap.cl$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    # Redirecciones relativas ("Location: /es"): sin esto nginx emite
    # http://insecap.cl:80/... detrás del TLS del VPS.
    absolute_redirect off;
    port_in_redirect off;

    # 404 real (sin soft 404). /404.html es el render prerenderizado de NotFound.
    error_page 404 /404.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Para las locations sin add_header propio (redirecciones, healthz).
    include /etc/nginx/snippets/security-headers.conf;

    # URLs antiguas → destino final en un salto, conservando la query. Va antes que la regla de
    # la barra final para que /cursos-empresas/ tampoco haga dos saltos.
    if ($legacy_redirect) {
        return 301 $legacy_redirect$is_args$args;
    }

    # Sin barra final: /es/nosotros/ → /es/nosotros (rewrite conserva la query).
    rewrite ^/(.+)/$ /$1 permanent;

    # Home: la canónica es /es. Conserva gclid/utm.
    location = / {
        return 301 /es$is_args$args;
    }

    # Healthcheck del contenedor (Dockerfile y docker-compose.yml).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # dist/index.html es el shell (sin contenido): no se publica como página.
    location = /index.html {
        return 301 /es$is_args$args;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Noticia publicada entre deploys (no estaba en el build): 200 + render en el cliente, sin
    # indexar hasta el próximo build. La meta robots del shell ya dice noindex,follow.
    # Los ea-* ya no pasan por aquí: son 301 a su categoría (redirects.map).
    location = /_shell.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Assets con hash: caché de un año. ^~ evita que el regex de extensiones gane.
    location ^~ /assets/ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Las regex se evalúan en orden: las más específicas primero.

    # Noticias: el HTML prerenderizado si existe; si no, el shell. Cursos, categorías y sedes salen
    # de datos locales (todo está en el build): un slug desconocido es 404 real.
    location ~ ^/(es|en|pt)/noticias/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /_shell.html;
    }

    # Páginas con prefijo de idioma: solo lo prerenderizado; lo demás, 404 real.
    # HTML con no-cache (revalida con ETag y deja usar el bfcache).
    location ~ ^/(es|en|pt)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # Archivos para crawlers y agentes (Fase 5, los genera scripts/prerender.mjs en cada build):
    # robots.txt, llms.txt y llms-full.txt como text/plain; charset=utf-8 (mime.types + charset),
    # y los sitemaps como application/xml (mime.types de nginx dice text/xml). Revalidan siempre.
    # /.well-known/ai-catalog.json no existe a propósito: cae en @sin_locale → 404 real.
    location ~ ^/(robots|llms|llms-full)\.txt$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/sitemap(-[a-z]+)?\.xml$ {
        types { application/xml xml; }
        charset_types application/xml;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Archivos estáticos de public/ con extensión: caché moderada.
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot|otf|mp4|webm)$ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Resto: archivos de la raíz (favicon.svg…) o rutas antiguas sin idioma.
    location / {
        try_files $uri @sin_locale;
    }

    location @sin_locale {
        # Locale inválido (/fr, /de/nosotros, /es-ar): 404 directo, sin 301.
        if ($uri ~ "^/[A-Za-z]{2}([-_][A-Za-z]{2})?(/|$)") {
            return 404;
        }
        # Archivo inexistente (/.well-known/ai-catalog.json, /favicon.png…): 404, no se redirige.
        if ($uri ~ "\.[A-Za-z0-9]+$") {
            return 404;
        }
        # Ruta sin prefijo de idioma (/nosotros?utm=…): 301 a /es conservando la query.
        return 301 /es$request_uri;
    }
}
