name: Deploy

on:
  push:
    branches: [main]
  # El TMS Plus lo dispara al publicar u ocultar una noticia (Tarea #8, decisión 1.6).
  workflow_dispatch:
  # Rebuild diario (05:00/06:00 en Chile): refresca noticias, cursos B2B y el filtro
  # de fechas de cursos abiertos, que se resuelven en el build (prerender).
  schedule:
    - cron: '0 9 * * *'

# Un solo deploy a la vez; uno nuevo cancela al que sigue en curso.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Construye la imagen, la prueba como la verán los bots y solo entonces la publica:
  # si algo falla, GHCR y el VPS siguen con la imagen anterior. Se publica exactamente
  # la imagen probada (docker tag + push), no un segundo build.
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22: scripts/check-hydration.mjs usa el WebSocket global.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build (load)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: insecap-landing:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BUILD_ID nuevo en cada ejecución (y reintento): obliga a rehacer el build
          # con datos frescos aunque el resto de la caché gha coincida.
          build-args: |
            BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
            VITE_TMS_API_URL=${{ vars.VITE_TMS_API_URL }}
            VITE_TMS_PLUS_API_URL=${{ vars.VITE_TMS_PLUS_API_URL }}
            VITE_ECOMMERCE_ENABLED=${{ vars.VITE_ECOMMERCE_ENABLED }}
            VITE_LECTURA_JSON=${{ vars.VITE_LECTURA_JSON }}
            VITE_B2B_CATALOG_ENABLED=${{ vars.VITE_B2B_CATALOG_ENABLED }}
            VITE_B2B_SHOPIFY_QUERY=${{ vars.VITE_B2B_SHOPIFY_QUERY }}
            VITE_SIMULATORS_ENABLED=${{ vars.VITE_SIMULATORS_ENABLED }}
            VITE_OPEN_COURSE_OFFER=${{ vars.VITE_OPEN_COURSE_OFFER }}
            VITE_URL_APPSTORE=${{ vars.VITE_URL_APPSTORE }}
            VITE_URL_PLAYSTORE=${{ vars.VITE_URL_PLAYSTORE }}

      - name: Start container
        run: |
          docker run -d --name web -p 8080:80 \
            --read-only --tmpfs /var/cache/nginx --tmpfs /var/run --tmpfs /tmp \
            insecap-landing:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "El contenedor no respondió /healthz"; docker logs web; exit 1

      - name: Test (scripts/check-bots.sh)
        env:
          B: http://localhost:8080
          HYDRATION: required
        run: bash scripts/check-bots.sh

      - name: Container logs
        if: failure()
        run: docker logs web || true

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag insecap-landing:ci "$tag"
            docker push "$tag"
          done <<< "$TAGS"

  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
