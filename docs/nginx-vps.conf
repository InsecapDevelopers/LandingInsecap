# Nginx del VPS (1.24) para insecap.cl — referencia, NO se despliega desde este repo.
#
# Este archivo vive fuera del contenedor: lo aplica a mano alguien con acceso al VPS
# (p. ej. en /etc/nginx/sites-available/insecap.cl). El contenedor Docker
# (nginx.conf del repo) escucha en 127.0.0.1:8080 (docker-compose.yml) y el VPS
# hace TLS y reverse proxy. Tarea #8, decisiones 1.2 y sección 5.
#
# Aplicar:
#   sudo nginx -t && sudo systemctl reload nginx
# Verificar:
#   curl -sI https://www.insecap.cl/es | head -3          # 301 → https://insecap.cl/es
#   curl -sI http://insecap.cl/es | head -3               # 301 → https://insecap.cl/es
#   curl -sI https://insecap.cl/es | grep -i strict-transport-security
#
# Además, en la copia de docker-compose.yml que está en VPS_APP_DIR, actualizar el
# healthcheck a la nueva ruta del contenedor (Fase 1):
#   test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]

# ---------------------------------------------------------------------------
# Log con User-Agent (va en el bloque http {}, p. ej. /etc/nginx/conf.d/insecap-log.conf).
# Permite medir las visitas de bots de IA:
#   grep -Ei 'GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-SearchBot|PerplexityBot|Google-Extended|Applebot-Extended|bingbot|Googlebot' \
#     /var/log/nginx/insecap.access.log | awk -F'"' '{print $6}' | sort | uniq -c | sort -rn
# ---------------------------------------------------------------------------
log_format insecap_ua '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time host=$host';

# ---------------------------------------------------------------------------
# http → https (ambos hosts) en un solo salto hacia el host canónico.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name insecap.cl www.insecap.cl;

    return 301 https://insecap.cl$request_uri;
}

# ---------------------------------------------------------------------------
# www → apex. Conserva ruta y query ($request_uri incluye gclid/utm).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.insecap.cl;

    # TODO: confirmar rutas reales del certificado en el VPS (debe cubrir www.insecap.cl).
    ssl_certificate     /etc/letsencrypt/live/insecap.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insecap.cl/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://insecap.cl$request_uri;
}

# ---------------------------------------------------------------------------
# Host canónico: https://insecap.cl → contenedor en 127.0.0.1:8080.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name insecap.cl;

    # TODO: confirmar rutas reales del certificado en el VPS.
    ssl_certificate     /etc/letsencrypt/live/insecap.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insecap.cl/privkey.pem;

    access_log /var/log/nginx/insecap.access.log insecap_ua;

    # HSTS SIN preload ni includeSubDomains hasta auditar el HTTPS de tms, api-plus
    # y tmsplus (el preload es casi irreversible).
    # TODO: pasar a "max-age=31536000; includeSubDomains; preload" tras esa auditoría.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compresión: gzip siempre; Brotli solo si el nginx del VPS trae el módulo
    # (nginx -V 2>&1 | grep -o brotli). Si no lo trae, dejar esas líneas comentadas.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/ld+json image/svg+xml;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/xml application/javascript
    #              application/json application/ld+json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Host reenviado: el contenedor usa server_name para su propio 301 de www.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las redirecciones del contenedor son relativas (absolute_redirect off);
        # no reescribirlas.
        proxy_redirect off;

        # El contenedor también emite HSTS (snippets/security-headers.conf, Fase 7): se oculta su
        # copia para que la respuesta lleve una sola cabecera, la de este bloque.
        proxy_hide_header Strict-Transport-Security;
    }
}
