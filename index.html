<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-preload-->
    <!-- Logo, fotos y la imagen LCP (VideoHero/PageHero) vienen del CDN de Shopify -->
    <link rel="preconnect" href="https://cdn.shopify.com" />

    <!-- Splash de marca: solo en la primera visita, fuera de React y sin bloquear el HTML prerenderizado.
         No se muestra a bots, navegadores automatizados, reduced-motion ni Save-Data; dura como máximo 1,2 s.
         Si cambia este script, recalcular su hash para el CSP (Fase 7). -->
    <style>
      #splash{display:none}
      html.splash-on #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:#485CC7;color:#fff;opacity:1;transition:opacity .3s ease}
      html.splash-out #splash{opacity:0}
      #splash svg{width:min(18rem,70vw);height:auto}
      #splash p{margin:0;font:500 .875rem/1 Montserrat,system-ui,sans-serif;letter-spacing:.42em;text-transform:uppercase;opacity:.85}
    </style>
    <script>
      (function(){try{
        var d=document.documentElement,n=navigator,k='insecap-splash-v1';
        if(localStorage.getItem(k)||n.webdriver||/bot|crawl|spider|slurp|lighthouse|pagespeed|headless|preview|gptbot|claudebot|perplexity|inspectiontool/i.test(n.userAgent)||matchMedia('(prefers-reduced-motion: reduce)').matches||(n.connection&&n.connection.saveData))return;
        localStorage.setItem(k,'1');
        d.classList.add('splash-on');
        setTimeout(function(){d.classList.add('splash-out')},900);
        setTimeout(function(){d.classList.remove('splash-on','splash-out')},1200);
      }catch(e){}})();
    </script>

    <!-- title, description, robots, canonical, og y JSON-LD de cada ruta: los inyecta scripts/prerender.mjs
         (react-helmet-async). En dev y en _shell.html los pone el cliente. -->
    <!--app-head-->

    <meta name="author" content="INSECAP" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#485CC7" />

    <!-- Terceros (GTM, gtag AW, Meta Pixel y Clarity), diferidos (Fase 6, decisión de terceros):
         las colas (dataLayer, gtag, fbq) existen desde el inicio, así que los eventos tempranos y el
         PageView inicial de Meta se encolan y salen cuando carga cada script. Los <script> externos se
         insertan con requestIdleCallback (timeout 2 s) tras el load, o en la primera interacción, lo que
         ocurra primero; GTM, cuando termina el gtag AW. Clarity lo carga entry-client con import() en el mismo momento (window.__on3p).
         Si cambia este script, recalcular su hash para el CSP (Fase 7). -->
    <script>
      (function(w,d){
        w.dataLayer=w.dataLayer||[];
        w.dataLayer.push({'gtm.start':new Date().getTime(),event:'gtm.js'});
        w.gtag=function(){w.dataLayer.push(arguments);};
        w.gtag('js',new Date());
        // TODO: quitar el gtag AW-817100949 cuando marketing confirme que ya está dentro de GTM-MPJBBMF (sección 4, punto 12).
        w.gtag('config','AW-817100949');
        if(!w.fbq){var n=w.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments);};
          if(!w._fbq)w._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];}
        w.fbq('init','3241702786017146');
        // PageView inicial: va en la cola y sale al cargar fbevents.js. Las navegaciones internas las
        // reporta MetaPixelPageView (AppShell), que omite el primer render para no duplicarlo.
        w.fbq('track','PageView');

        var done=false,cbs=[];
        w.__on3p=function(fn){done?fn():cbs.push(fn);};
        function add(src,cb){var j=d.createElement('script');j.async=true;j.src=src;if(cb){j.onload=j.onerror=cb;}d.head.appendChild(j);}
        var evs=['pointerdown','keydown','touchstart','scroll'];
        function load(){
          if(done)return;done=true;
          evs.forEach(function(e){w.removeEventListener(e,load,true);});
          // GTM va después del gtag AW: si GTM-MPJBBMF también trae AW-817100949 y su etiqueta corre
          // antes de que termine el gtag directo, baja otra copia (~160 KB, medido con LHCI). Con el AW
          // ya cargado, GTM lo reutiliza. onerror también sigue, para que un bloqueo no deje sin GTM.
          add('https://www.googletagmanager.com/gtag/js?id=AW-817100949',function(){
            add('https://www.googletagmanager.com/gtm.js?id=GTM-MPJBBMF');
          });
          add('https://connect.facebook.net/en_US/fbevents.js');
          while(cbs.length)cbs.shift()();
        }
        evs.forEach(function(e){w.addEventListener(e,load,{capture:true,passive:true});});
        function idle(){w.requestIdleCallback?w.requestIdleCallback(load,{timeout:2000}):setTimeout(load,2000);}
        d.readyState==='complete'?idle():w.addEventListener('load',idle);
      })(window,document);
    </script>


    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/isotipos/Insecap_Logo-09.png" />
    <!-- Montserrat va autoalojada en src/index.css (sin Google Fonts); el preload de 400 y 700 lo
         agrega scripts/prerender.mjs en el marcador app-preload. -->
</head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MPJBBMF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- Meta Pixel (sin JS): va en el body, una imagen dentro de <noscript> no es válida en el head -->
    <noscript><img height="1" width="1" alt="" style="display:none"
    src="https://www.facebook.com/tr?id=3241702786017146&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="splash" aria-hidden="true">
      <!-- TODO: reemplazar el texto por el logo SVG oficial de INSECAP (decisiones tarea #8, sección 4, punto 10). -->
      <svg viewBox="0 0 320 60" xmlns="http://www.w3.org/2000/svg"><text x="160" y="45" text-anchor="middle" font-family="Montserrat,system-ui,sans-serif" font-weight="700" font-size="44" letter-spacing="8" fill="#fff">INSECAP</text></svg>
      <p><!--splash-tagline--></p>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
