<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Splash de marca: solo en la primera visita, fuera de React y sin bloquear el HTML prerenderizado.
         No se muestra a bots, navegadores automatizados, reduced-motion ni Save-Data; dura como máximo 1,2 s.
         Si cambia este script, recalcular su hash para el CSP (Fase 7). -->
    <style>
      #splash{display:none}
      html.splash-on #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:#485CC7;color:#fff;opacity:1;transition:opacity .3s ease}
      html.splash-out #splash{opacity:0}
      #splash svg{width:min(18rem,70vw);height:auto}
      #splash p{margin:0;font:500 .875rem/1 Montserrat,system-ui,sans-serif;letter-spacing:.42em;text-transform:uppercase;opacity:.85}
    </style>
    <script>
      (function(){try{
        var d=document.documentElement,n=navigator,k='insecap-splash-v1';
        if(localStorage.getItem(k)||n.webdriver||/bot|crawl|spider|slurp|lighthouse|pagespeed|headless|preview|gptbot|claudebot|perplexity|inspectiontool/i.test(n.userAgent)||matchMedia('(prefers-reduced-motion: reduce)').matches||(n.connection&&n.connection.saveData))return;
        localStorage.setItem(k,'1');
        d.classList.add('splash-on');
        setTimeout(function(){d.classList.add('splash-out')},900);
        setTimeout(function(){d.classList.remove('splash-on','splash-out')},1200);
      }catch(e){}})();
    </script>

    <!-- title, description, robots, canonical, og y JSON-LD de cada ruta: los inyecta scripts/prerender.mjs
         (react-helmet-async). En dev y en _shell.html los pone el cliente. -->
    <!--app-head-->

    <meta name="author" content="INSECAP" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#485CC7" />
