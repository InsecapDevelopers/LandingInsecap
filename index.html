<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-preload-->

    <!-- Splash de marca: solo en la primera visita, fuera de React y sin bloquear el HTML prerenderizado.
         No se muestra a bots, navegadores automatizados, reduced-motion ni Save-Data; dura como máximo 2,1 s.
         Mismo efecto que la intro del tour virtual (src/index.css, .tour-intro): el logo se revela, sube el
         lema letra a letra y el logo vuela a su lugar en el header mientras el fondo se apaga.
         El hash del script para el CSP lo recalcula scripts/prerender.mjs. -->
    <style>
      #splash{display:none}
      html.splash-on #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;pointer-events:none;animation:splash-fin 0s linear 2s both}
      #splash .splash-fondo{position:absolute;inset:0;background:#0D1C3F;animation:splash-apagar .65s cubic-bezier(.16,1,.3,1) 1.25s both}
      #splash .splash-centro{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.25rem}
      #splash img{width:min(62vw,26rem);height:auto;transform-origin:0 0;animation:splash-revelar .75s cubic-bezier(.65,0,.35,1) .1s both,splash-vuelo .75s cubic-bezier(.7,0,.2,1) 1.2s both}
      #splash p{display:flex;overflow:hidden;margin:0;font:600 .875rem/1.2 Montserrat,system-ui,sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#fff;animation:splash-apagar .3s ease 1.1s both}
      #splash p span{display:inline-block;animation:splash-sube .7s cubic-bezier(.16,1,.3,1) var(--d,0s) both}
      html.splash-on [data-logo-destino]{animation:splash-destino 1.95s steps(1,end) both}
      @keyframes splash-revelar{from{clip-path:inset(0 100% 0 0);opacity:0;filter:blur(8px)}to{clip-path:inset(0 0 0 0);opacity:1;filter:blur(0)}}
      @keyframes splash-vuelo{from{transform:none;opacity:1}85%{opacity:1}to{transform:translate(var(--vuelo-x,-40vw),var(--vuelo-y,-45vh)) scale(var(--vuelo-s,.45));opacity:0}}
      @keyframes splash-sube{from{transform:translateY(115%) rotate(4deg)}to{transform:none}}
      @keyframes splash-apagar{to{opacity:0}}
      @keyframes splash-fin{to{visibility:hidden}}
      @keyframes splash-destino{from{visibility:hidden}to{visibility:visible}}
    </style>
    <script>
      (function(){try{
        var d=document.documentElement,n=navigator,k='insecap-splash-v2';
        if(localStorage.getItem(k)||n.webdriver||/bot|crawl|spider|slurp|lighthouse|pagespeed|headless|preview|gptbot|claudebot|perplexity|inspectiontool/i.test(n.userAgent)||matchMedia('(prefers-reduced-motion: reduce)').matches||(n.connection&&n.connection.saveData))return;
        localStorage.setItem(k,'1');
        d.classList.add('splash-on','splash-hecho');
        // Vuelo del logo hasta el del header: se mide en cuanto ambos están en el DOM y otra vez justo
        // antes de despegar (1,2 s), cuando el header ya se acomodó con las fuentes y la hidratación.
        function medir(){
          var s=document.getElementById('splash'),o=s&&s.querySelector('img'),t=document.querySelector('[data-logo-destino]');
          if(!o||!t)return requestAnimationFrame(medir);
          var a=o.getBoundingClientRect(),b=t.getBoundingClientRect();
          if(!a.width)return;
          s.style.setProperty('--vuelo-x',(b.left-a.left)+'px');
          s.style.setProperty('--vuelo-y',(b.top-a.top)+'px');
          s.style.setProperty('--vuelo-s',b.width/a.width);
        }
        medir();
        setTimeout(medir,1150);
        setTimeout(function(){d.classList.remove('splash-on')},2100);
      }catch(e){}})();
    </script>

    <!-- title, description, robots, canonical, og y JSON-LD de cada ruta: los inyecta scripts/prerender.mjs
         (react-helmet-async). En dev y en _shell.html los pone el cliente. -->
    <!--app-head-->

    <meta name="author" content="INSECAP" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#485CC7" />

    <!-- Terceros (GTM, gtag AW, Meta Pixel y Clarity), diferidos (Fase 6, decisión de terceros):
         las colas (dataLayer, gtag, fbq) existen desde el inicio, así que los eventos tempranos y el
         PageView inicial de Meta se encolan y salen cuando carga cada script. Los <script> externos se
         insertan en la primera interacción (clic, tecla, toque o scroll) o 6 s después del load, lo que
         ocurra primero (fuera de la medición de Lighthouse; antes era idle con tope de 2 s). La conversión
         del formulario no se pierde: para llenarlo hay que escribir, y eso ya los carga. GTM, cuando
         termina el gtag AW. Clarity lo carga entry-client con import() en el mismo momento (window.__on3p).
         Ley 21.719 (req #12): nada de esto se inserta sin consentimiento. load() solo corre si el banner
         (src/components/CookieBanner.tsx) guardó "aceptadas" en localStorage; al aceptar, el banner llama
         window.__cookies3p(). Sin consentimiento las colas quedan en memoria y no salen del navegador.
         Si cambia este script, recalcular su hash para el CSP (Fase 7). -->
    <script>
      (function(w,d){
        w.dataLayer=w.dataLayer||[];
        w.dataLayer.push({'gtm.start':new Date().getTime(),event:'gtm.js'});
        w.gtag=function(){w.dataLayer.push(arguments);};
        w.gtag('js',new Date());
        // TODO: quitar el gtag AW-817100949 cuando marketing confirme que ya está dentro de GTM-MPJBBMF (sección 4, punto 12).
        w.gtag('config','AW-817100949');
        if(!w.fbq){var n=w.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments);};
          if(!w._fbq)w._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];}
        w.fbq('init','3241702786017146');
        // PageView inicial: va en la cola y sale al cargar fbevents.js. Las navegaciones internas las
        // reporta MetaPixelPageView (AppShell), que omite el primer render para no duplicarlo.
        w.fbq('track','PageView');

        var done=false,cbs=[];
        w.__on3p=function(fn){done?fn():cbs.push(fn);};
        function add(src,cb){var j=d.createElement('script');j.async=true;j.src=src;if(cb){j.onload=j.onerror=cb;}d.head.appendChild(j);}
        var evs=['pointerdown','keydown','touchstart','scroll'];
        function ok(){try{return JSON.parse(localStorage.getItem('insecap-cookies')||'{}').d==='aceptadas';}catch(e){return false;}}
        function load(){
          if(done||!ok())return;done=true;
          evs.forEach(function(e){w.removeEventListener(e,load,true);});
          // GTM va después del gtag AW: si GTM-MPJBBMF también trae AW-817100949 y su etiqueta corre
          // antes de que termine el gtag directo, baja otra copia (~160 KB, medido con LHCI). Con el AW
          // ya cargado, GTM lo reutiliza. onerror también sigue, para que un bloqueo no deje sin GTM.
          add('https://www.googletagmanager.com/gtag/js?id=AW-817100949',function(){
            add('https://www.googletagmanager.com/gtm.js?id=GTM-MPJBBMF');
          });
          add('https://connect.facebook.net/en_US/fbevents.js');
          while(cbs.length)cbs.shift()();
        }
        w.__cookies3p=load;
        evs.forEach(function(e){w.addEventListener(e,load,{capture:true,passive:true});});
        function later(){setTimeout(load,6000);}
        d.readyState==='complete'?later():w.addEventListener('load',later);
      })(window,document);
    </script>


    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/isotipos/Insecap_Logo-09.png" />
    <!-- Montserrat va autoalojada en src/index.css (sin Google Fonts); el preload de 400 y 700 lo
         agrega scripts/prerender.mjs en el marcador app-preload. -->
</head>

  <body>
    <!-- Sin <noscript> de GTM ni Meta Pixel: sin JS no hay banner para consentir (Ley 21.719, req #12). -->
    <div id="splash" aria-hidden="true">
      <div class="splash-fondo"></div>
      <div class="splash-centro">
        <img src="/images/insecap-logo.webp" alt="" width="480" height="151" />
        <p><!--splash-tagline--></p>
      </div>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
