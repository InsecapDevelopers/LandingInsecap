# Cabeceras de seguridad comunes (Tarea #8, decisión 1.2).
#
# nginx NO hereda los add_header del bloque server en una location que define
# los suyos propios: por eso este snippet se incluye en el server Y en cada
# location que tenga add_header. Si agregas una location con add_header,
# incluye también este archivo.
#
# Fase 7 agrega aquí CSP (primero Report-Only, con hashes sha256 de los scripts
# inline), COOP y Permissions-Policy. HSTS lo emite el nginx del VPS (TLS),
# ver docs/nginx-vps.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
