# Cabeceras de seguridad comunes (Tarea #8, decisión 1.2 y Fase 7).
#
# nginx NO hereda los add_header del bloque server en una location que define
# los suyos propios: por eso este snippet se incluye en el server Y en cada
# location que tenga add_header. Si agregas una location con add_header,
# incluye también este archivo.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Mínima: el sitio no usa cámara, micrófono ni ubicación (tampoco Capin ni los mapas embebidos).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS SIN preload ni includeSubDomains: el preload es casi irreversible.
# TODO: auditar el HTTPS de tms, api-plus y tmsplus.insecap.cl y recién ahí pasar a
# "max-age=31536000; includeSubDomains; preload" (sección 5 del registro de decisiones).
# El VPS hace TLS y oculta esta copia (proxy_hide_header) para no duplicarla: docs/nginx-vps.conf.
add_header Strict-Transport-Security "max-age=31536000" always;
# frame-ancestors en enforce desde ya: equivale a X-Frame-Options SAMEORIGIN, que ya se aplica, y en
# Report-Only el navegador lo ignora.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
# Política completa en Report-Only, con los hashes de los scripts inline del build. La genera
# scripts/prerender.mjs (dist/csp.conf) y el Dockerfile la copia aquí.
include /etc/nginx/snippets/csp.conf;
